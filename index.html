<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mending | الموقع الشخصي</title>
    <!-- استيراد خط ماين كرافت الشهير من جوجل للغة الإنجليزية، وخط بكسلي مناسب للعربية -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* إعدادات الألوان الأساسية والخلفية الماينكرافتية */
        :root {
            --mc-dirt: #3c2f23;
            --mc-grass: #5c8e32;
            --mc-button: #7c7c7c;
            --mc-button-hover: #52a535;
            --mc-text-shadow: #2e2e2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Press Start 2P', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 1. شاشة الترحيب (Welcome Screen) */
        .welcome-screen {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            position: relative;
            z-index: 10;
        }

        .title-container {
            text-align: center;
            margin-bottom: 50px;
            animation: bounceTitle 2s infinite ease-in-out;
        }

        .main-title {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 4rem;
            color: #ffaa00;
            text-shadow: 5px 5px 0px var(--mc-text-shadow);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #bfbfbf;
            margin-top: 10px;
            text-shadow: 2px 2px 0px #000;
        }

        /* 2. أنيميشن ماين كرافت (Cute Characters) */
        .characters-container {
            display: flex;
            gap: 100px;
            margin-bottom: 60px;
        }

        .pixel-char {
            width: 70px;
            height: 90px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* حركات التنفس والقفز اللطيفة */
        .creeper-cute {
            animation: cuteFloat 1.8s infinite ease-in-out;
        }
        .skeleton-cute {
            animation: cuteFloat 1.8s infinite ease-in-out 0.4s;
        }

        /* رسم الكريبر بالبكسل */
        .creeper-head {
            width: 50px;
            height: 50px;
            background-color: #00aa00;
            border: 4px solid #000;
            position: relative;
        }
        .creeper-face {
            width: 30px;
            height: 25px;
            background: #000;
            position: absolute;
            bottom: 5px;
            left: 10px;
            clip-path: polygon(0% 0%, 33% 0%, 33% 40%, 66% 40%, 66% 0%, 100% 0%, 100% 60%, 66% 60%, 66% 100%, 33% 100%, 33% 60%, 0% 60%);
        }
        .creeper-body {
            width: 40px;
            height: 40px;
            background-color: #007700;
            border: 4px solid #000;
            border-top: none;
        }

        /* رسم السكيلتون بالبكسل */
        .skeleton-head {
            width: 50px;
            height: 50px;
            background-color: #cbcbcb;
            border: 4px solid #000;
            position: relative;
        }
        .skeleton-eyes {
            width: 34px;
            height: 8px;
            background: #000;
            position: absolute;
            top: 18px;
            left: 8px;
            display: flex;
            justify-content: space-between;
        }
        .skeleton-eyes::before, .skeleton-eyes::after {
            content: '';
            width: 10px;
            height: 8px;
            background: #000;
        }
        .skeleton-mouth {
            width: 20px;
            height: 6px;
            background: #747474;
            position: absolute;
            bottom: 8px;
            left: 15px;
        }
        .skeleton-body {
            width: 24px;
            height: 40px;
            background-color: #9e9e9e;
            border: 4px solid #000;
            border-top: none;
        }

        /* 3. زر ماين كرافت (Minecraft UI Button) */
        .mc-button {
            font-family: 'Cairo', sans-serif;
            font-size: 1.4rem;
            color: #e0e0e0;
            background-color: var(--mc-button);
            padding: 15px 40px;
            text-decoration: none;
            border: 4px solid #000;
            box-shadow: inset -4px -4px 0px #4a4a4a, inset 4px 4px 0px #b5b5b5;
            cursor: pointer;
            transition: all 0.1s ease;
            text-shadow: 2px 2px 0px #000;
        }

        .mc-button:hover {
            color: #ffffff;
            background-color: var(--mc-button-hover);
            box-shadow: inset -4px -4px 0px #2a541a, inset 4px 4px 0px #8cd853;
        }

        .mc-button:active {
            box-shadow: inset 4px 4px 0px #4a4a4a, inset -4px -4px 0px #b5b5b5;
            transform: translateY(2px);
        }

        /* 4. قسم المعلومات (Info Section) */
        .info-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #2c2c2c;
            background-image: matrix(1, 0, 0, 1, 0, 0); /* حشو تكتشر */
            border-top: 10px solid #141414;
            padding: 40px 20px;
        }

        .info-card {
            background-color: rgba(16, 16, 16, 0.85);
            border: 6px solid #000;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
        }

        .info-card h2 {
            color: #55ff55;
            font-size: 2rem;
            margin-bottom: 25px;
            text-shadow: 3px 3px 0px #000;
        }

        .info-card p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #dddddd;
            margin-bottom: 30px;
        }

        /* 5. روابط السوشيال ميديا */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border: 4px solid #000;
            text-shadow: 2px 2px 0px #000;
        }

        .btn-instagram {
            background-color: #c13584;
            box-shadow: inset -4px -4px 0px #701c4b, inset 4px 4px 0px #f062b1;
        }
        .btn-instagram:hover { background-color: #d63e96; }

        .btn-discord {
            background-color: #5865F2;
            box-shadow: inset -4px -4px 0px #2f378a, inset 4px 4px 0px #8ea1ff;
        }
        .btn-discord:hover { background-color: #6975f7; }

        /* الأنيميشنز الجاهزة (Animations) */
        @keyframes bounceTitle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.03); }
        }

        @keyframes cuteFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <!-- شاشة الترحيب الأولى -->
    <section class="welcome-screen">
        <div class="title-container">
            <h1 class="main-title">MENDING</h1>
            <p class="subtitle">أهلاً بك في عالمي الخاص</p>
        </div>

        <!-- الانيميشن اللطيف للوحوش -->
        <div class="characters-container">
            <!-- الكريبر اللطيف -->
            <div class="pixel-char creeper-cute">
                <div class="creeper-head"><div class="creeper-face"></div></div>
                <div class="creeper-body"></div>
            </div>
            
            <!-- السكيلتون اللطيف -->
            <div class="pixel-char skeleton-cute">
                <div class="skeleton-head">
                    <div class="skeleton-eyes"></div>
                    <div class="skeleton-mouth"></div>
                </div>
                <div class="skeleton-body"></div>
            </div>
        </div>

        <!-- زر الانتقال بستايل ماينكرافت -->
        <a href="#info" class="mc-button">دخول لمعلوماتي</a>
    </section>

    <!-- قسم معلوماتك الشخصية وروابطك -->
    <section id="info" class="info-section">
        <div class="info-card">
            <h2>بطاقة معلوماتي</h2>
            <p>
                مرحباً! أنا **Mending**، صانع محتوى ولاعب مهتم بعالم ماينكرافت والبرمجة. 
                هنا يمكنك العثور على جميع حساباتي الرسمية والتواصل معي مباشرة.
            </p>

            <div class="social-links">
                <!-- استبدل "#" برابط الانستقرام الخاص بك -->
                <a href="https://instagram.com" target="_blank" class="social-btn btn-instagram">
                    📸 انستقرام (Instagram)
                </a>
                
                <!-- استبدل "#" برابط سيرفر الديسكورد الخاص بك -->
                <a href="https://discord.gg" target="_blank" class="social-btn btn-discord">
                    💬 ديسكورد (Discord)
                </a>
            </div>
        </div>
    </section>

</body>
</html>
